<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(145deg, #d3d3d3, #f0f0f0); /* Matte-like muted gradient */
            background-attachment: fixed;
        }

        .container {
            margin-top: 80px;
            background: #ffffffcc; /* Semi-transparent white for a smooth glass/matte feel */
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
            width: 400px;
            backdrop-filter: blur(4px);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            justify-content: space-between;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-right: 10px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #f8f8f8;
            color: #2c3e50;
        }

        input[type="text"]:focus {
            border-color: #888;
            box-shadow: 0 0 5px rgba(136, 136, 136, 0.3);
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #5a6268;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #e9ecef;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #343a40;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 18px;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: #bd2130;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Enter a new task..." required>
            <button type="submit">Add</button>
        </form>

        <ul>
            {% for task in todo_list %}
                <li>
                    {{ task }}
                    <form action="{{ url_for('delete_task', task_id=loop.index0) }}" method="get" style="margin: 0;">
                        <button class="delete-btn" title="Delete">❌</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
